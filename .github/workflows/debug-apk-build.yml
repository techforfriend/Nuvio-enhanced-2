name: Debug APK (manual)

on:
  workflow_dispatch: {}

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        # Do NOT use `submodules: true/recursive` here: the MPVKit submodule's pinned
        # commit goes stale (its upstream fork rebases), so a plain submodule checkout
        # fails with "git failed with exit code 128". We fetch the tracked branch's
        # latest tip instead in the next step.

      - name: Fetch MPVKit submodule (latest Nuvio branch)
        run: |
          git submodule sync --recursive
          git submodule update --init --remote --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # "playstore" flavor = plain ExoPlayer build, the simplest one to sideload/test.
      # Swap for assembleFullDebug if you specifically want the "full" distribution.
      - name: Build debug APK
        run: ./gradlew :androidApp:assemblePlaystoreDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-debug-apk
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
