name: Build Nuvio Enhanced APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioEnhanced-APKs
          path: build-apks/*.apk
          retention-days: 14

      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.1-enhanced-pre13
          name: "Nuvio Enhanced v0.6.1-beta (Update 13 - CloudStream Details & Direct Playback Integration)"
          body: |
            ## Nuvio Enhanced v0.6.1-beta (Update 13)

            Critical update integrating full CloudStream Details screen metadata and direct player stream resolution:

            ### 🚀 Features & Fixes in Update 13:
            1. **CloudStream Details Screen Metadata:**
               - Fixed "No addon provides meta for this content" error when clicking CloudStream items on Home or Catalog.
               - `MetaDetailsRepository` now directly handles CloudStream route IDs (`parseCloudStreamRouteId`), loading posters, backdrops, cast, genres, descriptions, and episode lists seamlessly from CloudStream providers.
            2. **Direct CloudStream Stream & Link Extraction:**
               - `StreamsRepository` and `PlayerStreamsRepository` now natively recognize CloudStream video IDs and invoke `CloudStreamRepository.loadLinks()` to extract direct playback URLs, qualities, and subtitles.
            3. **ARM64 Pure Architecture:**
               - Built exclusively for 64-bit ARM Android devices (`arm64-v8a`).
          draft: false
          prerelease: true
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

