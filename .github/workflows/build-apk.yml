name: Build Nuvio Enhanced APK

on:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Set up Rust
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.5
          name: "Nuvio Enhanced v0.6.5"
          body: |
            ## What's New in v0.6.5
            **Nuvio Enhanced Official Release**

            ### 📺 Live TV Navigation Toggle
            - **Direct ON/OFF Toggle:** Added a direct toggle in Live TV settings to easily show or hide the Live TV tab in bottom navigation at any time, regardless of whether a playlist is configured.

            ### 💬 Subtitle Streaming Fixes
            - **GZIP Stream Decompression:** Fixed issues with compressed subtitles (`.srt.gz`, `.vtt.gz`, `.gz`) by adding automatic GZIP detection and stream decompression.
            - **Sanitized CDN Headers:** Corrected HTTP `Accept` headers to prevent CDN servers from rejecting subtitle requests.
            - **Automated Player Fallback:** If the sidecar cue parser produces zero cues, the player automatically reloads via media item configuration so subtitles never fail silently.

            ### 📖 Nuvio Read Overview & Clean Details View
            - **Interactive Synopsis & Ratings:** Ported the "Nuvio Read" overview card from `AKRusso/NuvioMobile-Enhanced`, featuring story synopsis, quick metadata badges, and an interactive ratings sheet.
            - **Clean Details Page:** Removed duplicate Director and Writer text sections from the details view, keeping cast and crew photos clean and uncluttered.
            - **Nuvio Read Toggle:** Enable or disable Nuvio Read anytime from Settings → Nuvio Enhanced.

            ### 🎮 Bottom-Left Player Controls
            - **Reorganized Player Layout:** Relocated Watch Party, Picture-in-Picture (PiP), HLS Video Quality selector, and Subtitles to the bottom-left area of the player overlay for quick, one-handed access.

            ### 📋 Unified What's New Section
            - **Consolidated Overview:** Replaced fragmented changelog sections in Settings with a single, unified box featuring both custom additions and core upstream improvements by official developer Luqman.

            ### ⚡ CloudStream 3 & Pure Engine
            - **Pure CS3 Architecture:** Purged all legacy Vega provider components and dependencies for optimized memory usage and rock-solid stability.
            - **Default Verified Tracking:** Trakt.tv, SIMKL, and MDBList pre-configured with verified credentials for instant linking without API setup.
            - **Hardware 200% Volume Boost:** Loudness enhancement up to 200% with audio HUD indicator.
            - **Full IPTV Suite:** Support for M3U playlists, Xtream Codes API, Stalker Portal, and XMLTV EPG guides.
          draft: false
          prerelease: false
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

