name: Build Nuvio Enhanced APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioEnhanced-APKs
          path: build-apks/*.apk
          retention-days: 14

      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.1-enhanced-pre8
          name: "Nuvio Enhanced v0.6.1-beta (Update 8 - Nuvio Experience & Hero Poster Theming)"
          body: |
            ## Nuvio Enhanced v0.6.1-beta (Update 8)

            Comprehensive update delivering full Nuvio Experience intelligence controls and complete Home Screen Hero Poster theming across all 18 themes!

            ### 🌟 What's New & Fixed in Update 8:
            1. **Nuvio Experience Intelligence Fully Working:**
               - **Profile Insights & Concierge:** Tapping on the active profile in Settings now opens the full Profile Insights dashboard (Hero banner, Taste Profile DNA, Taste Balance Leaning, Overview Stats grid, Favorite People rail, and Nuvio Concierge).
               - **Home Concierge Section:** When Nuvio Concierge is toggled in Nuvio Experience settings, the intelligent Concierge card with Smart Resume signals, release radar, and stats appears directly on the Home Screen.
               - **Continue Watching Ready Badges:** "Show Ready Badge" toggle now renders smart signal pills ("Next episode ready", "New season ready", "Resume-ready", "Almost there", "Quick finish") on all continue watching cards.
               - **Favorite People Management:** Add, pin, and manage favorite actors/directors with full inline carousel and dedicated view page.
            2. **Home Screen Hero Poster Theming 100% Fixed:**
               - **Action Accent on Hero CTA:** "View Details" button now dynamically uses the active theme's accent gradient or solid brush (`actionAccent.brush`) and contrast text color (`actionAccent.contentColor`) for all 18 themes (Classic, Supporter, Animated Enhanced).
               - **Themed Page Indicator Dots:** Active indicator dot now illuminates with the theme's animated line brush or accent palette.
               - **Poster Art Hero Dimensions & Background Fade:** Seamlessly fades into the active theme's background color with correct aspect ratio and zero layout jumping during loading.
            3. **ARM64 Optimized:**
               - Built exclusively for 64-bit ARM Android devices (`arm64-v8a`).
          draft: false
          prerelease: true
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
