name: Build Nuvio Enhanced APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioEnhanced-APKs
          path: build-apks/*.apk
          retention-days: 14

      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.1-enhanced-pre10
          name: "Nuvio Enhanced v0.6.1-beta (Update 10 - CloudStream Storage & Runtime Initialization Fix)"
          body: |
            ## Nuvio Enhanced v0.6.1-beta (Update 10)

            Hotfix update fixing CloudStream plugin storage and Android runtime initialization:

            ### 🔧 Fixes in Update 10:
            1. **CloudStream Storage Initialization:**
               - Fixed `CloudStream storage is not initialized` error during `.cs3` plugin installation.
               - Added early initialization in `NuvioApplication.onCreate` and `MainActivity.onCreate`.
               - Implemented automatic fallback context recovery via `ActivityThread.currentApplication()` in `CloudStreamPlatformStorage` and `CloudStreamPlatformRuntime` to prevent any uninitialized storage state across background coroutines and configuration changes.
            2. **Pure ARM64 Optimized:**
               - Built exclusively for 64-bit ARM Android devices (`arm64-v8a`).
          draft: false
          prerelease: true
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

