name: Build Nuvio Enhanced APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioEnhanced-APKs
          path: build-apks/*.apk
          retention-days: 14

      - name: Publish GitHub Stable Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.1-enhanced-stable
          name: "Nuvio Enhanced v0.6.1 Stable Release"
          body: |
            ## Nuvio Enhanced v0.6.1 Stable Release
            **by RAJA JI**

            🎉 **Official Stable Release of Nuvio Enhanced v0.6.1!**

            This stable release brings full CloudStream 3 provider integration, 18 customized themes, Jellyfin/Plex native streaming, and complete bug fixes across playback, metadata, and UI.

            ### 🌟 Key Features & Highlights:
            1. **Redesigned CloudStream Extension Switcher (Exact Match):**
               - Sleek floating pill button at bottom-right with warm orange border and stacked layers icon.
               - Custom popup card floating above the pill with dark theme, orange highlights, provider play badges, and checkmarks.
            2. **Enhanced Settings Home Features (Fully Wired & Active):**
               - Full visibility of Nuvio Experience and Premium Labs under the Home category tab.
               - Smart Shelves, Release Radar Signals, Quiet Home Mode, Original Hero Banner, Compact Metadata, Ratings Above Metadata, and Hero Display Modes (Cinematic, Balanced, InfoRich).
            3. **Full CloudStream 3 Engine Integration:**
               - Run native CloudStream 3 `.cs3` plugin repositories and extensions.
               - CloudStream home catalogues, multi-provider search, and complete Details screen metadata (posters, backdrops, cast, genres, seasons & episodes).
               - Direct link extraction with subtitle parsing and multi-quality HLS / MP4 playback.
            4. **Playback Availability & Direct Auto-Play:**
               - Seamless streaming with no "Playback unavailable" blocks or setup errors.
               - Smooth auto-play transition directly into the video player.
            5. **18 Customized Themes & Personalization:**
               - 18 themes including Dracula, Catppuccin Mocha, Nord, Cyberpunk, AMOLED Black, Monokai Pro, Tokyo Night, Sunset Glow, and dynamic hero poster theming.
               - "by RAJA JI" customized footer branding.
            6. **Pure ARM64 Architecture:**
               - Built and optimized exclusively for 64-bit ARM Android devices (`arm64-v8a`) for peak performance and minimal resource overhead.
          draft: false
          prerelease: false
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

