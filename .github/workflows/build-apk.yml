name: Build Nuvio Enhanced APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioEnhanced-APKs
          path: build-apks/*.apk
          retention-days: 14

      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.1-enhanced-pre12
          name: "Nuvio Enhanced v0.6.1-beta (Update 12 - CloudStream Runtime ProGuard & Dex Class Loading Fix)"
          body: |
            ## Nuvio Enhanced v0.6.1-beta (Update 12)

            Critical stability update fixing CloudStream extension dynamic Dex loading, R8/ProGuard preservation, and provider execution:

            ### 🚀 Features & Fixes in Update 12:
            1. **CloudStream Runtime ProGuard / R8 Fix:**
               - Added comprehensive R8 keep rules for `com.lagradost.**`, `com.fasterxml.jackson.**`, `org.jsoup.**`, `org.mozilla.javascript.**`, `com.uwetrottmann.tmdb2.**`, `me.xdrop.fuzzywuzzy.**`, `dev.whyoleg.cryptography.**`, `org.schabi.newpipe.extractor.**`, `okhttp3.**`, and `okio.**`.
               - Completely eliminates `ClassNotFoundException: Didn't find class "com.megix.Bollyflix" on path: DexPathList...` when loading CloudStream `.cs3` plugins in release builds.
            2. **Enhanced Dynamic Extension Reliability:**
               - All CloudStream third-party plugins (Bollyflix, CineStream, MegaRepo, etc.) now properly resolve runtime base classes (`Plugin`, `MainAPI`, NiceHttp, Jackson, Jsoup, Rhino) without ART linker failures.
            3. **Increased Provider Fetch Window:**
               - Expanded provider preview timeout to 10s to ensure slower or Cloudflare-protected catalogs load reliably on home startup.
            4. **ARM64 Pure Architecture:**
               - Built exclusively for 64-bit ARM Android devices (`arm64-v8a`).
          draft: false
          prerelease: true
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

