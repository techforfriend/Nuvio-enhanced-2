name: Build Nuvio Enhanced APK

on:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Set up Rust
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Restore release keystore from secrets
        env:
          NUVIO_RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          # NOTE: secrets cannot be referenced in a step `if:` expression
          # (GitHub rejects the workflow at parse time), so the
          # empty-secret check lives here in shell instead.
          if [ -n "$NUVIO_RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$NUVIO_RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/nuvio-enhanced.jks
          else
            echo "No release keystore secret set, skipping restore."
          fi

      - name: Build Android Release APK
        env:
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.13
          name: "Nuvio Enhanced v0.6.13"
          body: |
            ## What's New in v0.6.13
            **Nuvio Enhanced Official Release — version 0.6.13 (version code 156)**

            ### 🆕 New in this version
            - Chapters — chapters on iOS, and ExoPlayer reads them as NuvioTV does; chapters setting for both engines and a chapter title toggle
            - Simkl — sign-in migrated to OAuth AUTH V2; More Like This source applied in details
            - Player — each start-up step shown on the loading screen; ExoPlayer and libmpv errors worded the same way as NuvioTV; HTTP status shown when mpv fails to open a stream; audio clock used when mpv video time drops to 0; HLS streams get an SPS/PPS init segment when they lack one; DASH routing kept for explicit MIME hints; seekbar thumbnails load much faster
            - Streams — falls back to the next matching source on failure; debrid cache checked once per source search; tokenized links kept for reuse and expired saved links refreshed; source list opens on the playing stream; addon filter change starts at the top; episode header artwork blends smoothly into the background; static glass shows the streams artwork backdrop
            - Live TV — HLS quality chooser restored; endless buffering and black screen fix
            - Continue Watching — choose what selecting an item opens; dismiss a next-up show by its content id
            - Subtitles — preferences isolated per device; config export/import and profile removal for device subtitle prefs
            - Grid — 6 posters per row in landscape, 7 on tablets; folders respect "Show catalog type"
            - Player controls — up/down arrows change the volume; basic keyboard support; seek preview prefetch pauses while buffering
            - Home & startup — fewer recompositions during startup; brand wordmark decoded off the main thread; hero shows only after its source catalogs load; trailer mute button in the top-right corner
            - iOS — MPVKit bumped to the nuvio.7 artifacts; Dolby Vision RPU reshaping in Picture in Picture; Dolby Vision Profile 5 frames converted for PiP; HDR colours kept when drawing subtitles in PiP; mpv drawable at native resolution; toolbar fade extended to screen edges in landscape; collection header collapses under the native bar; back button in iPad settings sub-pages; hero trailer fix in the cinematic details background
            - Translation updates: French, Vietnamese, Slovak, Dutch
          draft: false
          prerelease: false
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

