name: Build Nuvio Enhanced APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioEnhanced-APKs
          path: build-apks/*.apk
          retention-days: 14

      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.1-enhanced-pre6
          name: "Nuvio Enhanced v0.6.1-beta (Update 6 - Settings Wiring, Download Button & Gradient Themes)"
          body: |
            ## Nuvio Enhanced v0.6.1-beta (Update 6)

            Major update fixing all Nuvio Enhanced home and hero settings options, adding the missing download button to details, and fully integrating animated gradient themes with custom UI component styling.

            ### 🌟 What's New & Fixed in Update 6:
            1. **All Nuvio Enhanced Settings Fully Functional:**
               - Hero display modes, Poster Art Hero, and Streaming Showcase Hero options now correctly apply to the home screen.
               - Video preview and sound toggles are active and respected.
               - Nuvio Concierge and Smart Shelves sections properly display on home when enabled.
               - Continue Watching "Ready to Watch" smart signal badges wired.
            2. **Download Button Feature Added:**
               - Added "Show download button" switch in Nuvio Enhanced settings under Details Screen.
               - Added dedicated Download action button in Movie and Series detail screens.
            3. **Animated Gradient Themes & UI Theming:**
               - Restored Enhanced Themes: Messenger, Amethyst, Blossom, Lagoon, Sunset, and Custom.
               - Custom theme dual-color HSV and hex color picker.
               - Dynamic animated theme accents applied across the app (Netflix Info button on hero, Play CTA buttons, action buttons, progress bars, and selection chips).

            ### 📥 Download APK
            Choose the build matching your Android device architecture below (most devices use `arm64-v8a` or `universal`).
          draft: false
          prerelease: true
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
