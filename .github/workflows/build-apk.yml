name: Build Nuvio Enhanced APK

on:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Set up Rust
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Publish GitHub Testing Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.4-beta.5
          name: "Nuvio Enhanced v0.6.4-beta.5"
          body: |
            ## What's New in v0.6.4-beta.5
            **by RAJA JI**

            ### 🎯 Out-of-the-Box Tracking Accounts Fix:
            - **Trakt Sync & Scrobble:** Pre-configured with verified client credentials. Seamlessly connect via Device Code (`https://auth.trakt.tv/activate`) or browser OAuth. Watch progress, scrobble, and continue watching sync are fully operational without "Missing credentials" errors.
            - **SIMKL Integration:** Pre-configured with verified SIMKL Client ID. Instant PIN authorization (`https://simkl.com/pin`) and complete sync for Anime, TV Shows, and Movies.
            - **MDBList Account Sync:** Pre-configured with dedicated Device Code authorization (`https://mdblist.com/oauth/device/`) for automated watch progress and personal library lists sync.
            - **AniList & WeTrakr:** Verified 100% operational out of the box with complete anime ID mappings and tracking.
            - **IntroDB Skipping:** Built-in IntroDB API endpoint configured for automated anime and series intro/outro skips.

            ### 🧹 Complete Vega Purge & UI Cleanup:
            - **Vega Providers Completely Removed:** Fully purged all Vega provider scrapers, models, runtime adapters, and legacy bridge files from the codebase.
            - **Clean & Focused UI:** Removed Vega providers option box, Beta pills, and Vega catalogs from the Home screen and Settings.
            - **Pure CloudStream (CS3) Engine:** Streamlined extension handling strictly around CloudStream providers and Stremio addons for reduced resource usage and maximum stability.

            ### ⚡ Performance & Playback Enhancements:
            - Instant catalog rendering without dead extension delays.
            - Streamlined player pipeline for smooth buffer-free streaming across all active providers.
          draft: false
          prerelease: true
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

