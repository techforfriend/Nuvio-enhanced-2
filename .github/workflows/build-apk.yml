name: Build Nuvio Enhanced APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioEnhanced-APKs
          path: build-apks/*.apk
          retention-days: 14

      - name: Publish GitHub Testing Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.4-beta.3-testing
          name: "Nuvio Enhanced v0.6.4-beta.3 (Upstream 0.6.4-beta Merged, CS3 Overhaul & Volume Boost)"
          body: |
            ## What's New in v0.6.4-beta.3
            **by RAJA JI**

            ### 🚀 Upstream 0.6.4-beta Full Merge:
            - **DNS-over-HTTPS (DoH):** Cloudflare, Google, AdGuard, Quad9, and custom DoH resolver support.
            - **Player Enhancements:** nuvio-libass atlas rendering, time-left toggle, stream end-time display, custom skip durations.
            - **Ratings & Visuals:** Ratings on hero banners, poster zoom previews, liquid glass navigation & styling.
            - **Optimizations:** Debrid regex caching, stream badge caching, tablet UI refinements, WeTrakr integration, WhatsNew screen.

            ### 🌟 Preserved Custom Enhancements:
            - **CloudStream 3 (CS3) Repository Toggle:** Master ON/OFF toggle switch for every repository in Settings.
            - **Home Screen Single Extension Selection:** Single selectable extensions with instant catalog loading.
            - **CS3 Extension Catalog Loading Fix:** 30s timeout and automatic catalog recovery for community extensions.
            - **11 CS3 Core Subsystem Bug Fixes:** Thread-safe cookies, storage locks, anime sub/dub collisions, native library handling, cache TTL.
            - **Digital Volume Boost (Up to 200%):** Hardware-accelerated Loudness Enhancer for ExoPlayer and digital boost for libmpv with golden amber indicator.
            - **Custom HSV Theme Picker:** Full custom color picker with Saturation/Value canvas and Hue slider.
            - **Live TV & App Stability:** Live TV navigation tab, duplicate key crash fixes, and seamless background sync.
          draft: false
          prerelease: true
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

