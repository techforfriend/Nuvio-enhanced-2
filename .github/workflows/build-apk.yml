name: Build Nuvio Enhanced APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioEnhanced-APKs
          path: build-apks/*.apk
          retention-days: 14

      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.1-enhanced-pre3
          name: "Nuvio Enhanced v0.6.1-beta (Update 3 - Feature Activation)"
          body: |
            ## Nuvio Enhanced v0.6.1-beta (Update 3)

            Updated release of **Nuvio Enhanced v0.6.1-beta** with active UI hooks for all Nuvio Enhanced settings.

            ### 🌟 Key Updates in Update 3:
            - **Player Device Status HUD Active:** Toggling "Player status overlay" now renders the top status HUD displaying network connection (Wi-Fi/LTE), current time, battery percentage with charging indicator, and estimated completion time.
            - **Player Clock & End-Time Overlay:** Toggling "Player time" now displays current wall clock time and projected finish time overlay.
            - **Persistent Next Episode Button:** Toggling "Next episode button" keeps the next episode button readily available during series playback.
            - **Home Hero Customization Active:** Home screen hero banner now actively respects "Show hero overview", "Show hero ratings" (IMDb star rating), "Show details button", and artwork mode toggles.
            - **Supabase Login & Authentication Working:** Official API and Supabase endpoints connected.
            - **All Premium Themes & Gradients Unlocked:** Gold, Jade, Rose Gold, Arctic Blue, Graphite, and full multi-color gradient editor unlocked out of the box.
            - **Clean UI:** Discord and About section removed, branding updated to "Nuvio Enhanced".

            ### 📥 Download APK
            Choose the build matching your Android device architecture below (most devices use `arm64-v8a` or `universal`).
          draft: false
          prerelease: true
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
