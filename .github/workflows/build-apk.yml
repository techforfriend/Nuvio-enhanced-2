name: Build Nuvio Enhanced APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioEnhanced-APKs
          path: build-apks/*.apk
          retention-days: 14

      - name: Publish GitHub Testing Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.4-beta.2-testing
          name: "Nuvio Enhanced v0.6.4-beta.2 Testing Release (CS3 Overhaul & Volume Boost)"
          body: |
            ## What's New in v0.6.4-beta.2 (Testing Release)
            **by RAJA JI**

            ### 🌟 What's New:
            - **CloudStream 3 (CS3) Repository Toggle:** Master ON/OFF toggle switch for every repository in Settings. Instantly enable or disable entire plugin repos with persistent state across app restarts.
            - **Home Screen Single Extension Selection:** Removed redundant "All extensions" multi-fetch. Individual extensions are now selectable with instant catalog loading.
            - **CS3 Extension Catalog Loading Fix:** Resolved catalog failures for community extensions lacking explicit `hasMainPage` flags and extended discovery/preview timeouts (30s) to guarantee smooth loading.
            - **11 CS3 Core Subsystem Bug Fixes:**
              - Thread-safe Cloudflare & DDoS-Guard bypass cookies with `ConcurrentHashMap`.
              - Safe platform storage file locking on Android sandbox.
              - 1-hour TTL cache expiration to prevent stale media metadata.
              - Anime Sub/Dub episode ID and title collisions resolved.
              - Native library path loader and provider leak prevention.
            - **Digital Volume Boost (Up to 200%):** Hardware-accelerated Loudness Enhancer for ExoPlayer and digital amplification for libmpv with golden amber gesture boost indicator.
            - **Enhanced Settings Toggle:** Volume Boost switch in Enhanced Settings (`Player` category).
            - **Player & System Stability:** Fixed Live TV duplicate key crash and Continue Watching progress sync.
          draft: false
          prerelease: true
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

