name: Build Nuvio Enhanced APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioEnhanced-APKs
          path: build-apks/*.apk
          retention-days: 14

      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.1-enhanced-pre9
          name: "Nuvio Enhanced v0.6.1-beta (Update 9 - Full CloudStream (.cs3) Integration)"
          body: |
            ## Nuvio Enhanced v0.6.1-beta (Update 9)

            Major update introducing full production-grade CloudStream (`.cs3`) extension compatibility and repository management directly inside Nuvio Enhanced, built strictly for 64-bit ARM (`arm64-v8a`)!

            ### 🚀 What's New & Upgraded in Update 9:
            1. **Full CloudStream (.cs3) Engine Integration:**
               - **CloudStream Repository Management:** Add, update, and manage official and third-party CloudStream repository URLs directly under `Settings > Content Discovery > CloudStream / CS3`.
               - **Plugin Catalog & Downloader:** Browse, download, inspect, and toggle `.cs3` plugins with SHA-256 verification and version tracking.
               - **Native Compatibility Shim & Runtime:** Complete Android bridge ABI implementing `CloudStreamApp`, `PluginManager`, `RepositoryManager`, `DataStore`, `RequestsHelper`, `CloudflareKiller`, and `DdosGuardKiller`.
               - **Unified Stream Resolver:** CloudStream providers seamlessly run alongside Stremio Addons, Local Plugins, and Media Server Streams (Jellyfin/Plex/Emby) with isolated parallel timeouts and coroutine safety.
               - **Search Route Indexing & KickTr Fallback:** Intelligent TMDB / IMDb / title matching for fast source discovery across anime, movies, and TV shows.
            2. **All 18 Themes Fully Unlocked & Preserved:**
               - Classic, Supporter, and Animated Enhanced themes with dynamic Hero Poster theming, accent gradients, and custom player styles.
            3. **Strictly ARM64 Optimized:**
               - Built exclusively for 64-bit ARM Android devices (`arm64-v8a`) for maximum speed, native LSE atomics, and lowest memory footprint.
          draft: false
          prerelease: true
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

