name: Build Nuvio Enhanced APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioEnhanced-APKs
          path: build-apks/*.apk
          retention-days: 14

      - name: Publish GitHub Testing Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.4-beta.1-testing
          name: "Nuvio Enhanced v0.6.4 Testing Release (Volume Boost)"
          body: |
            ## What's New in v0.6.4 (Testing Release)
            **by RAJA JI**

            ### 🌟 What's New:
            - **Digital Volume Boost (Up to 200%):** Integrated Android hardware-accelerated Loudness Enhancer for ExoPlayer and digital audio amplification for libmpv. Dialogue in movies and shows with 5.1/7.1 surround sound is now significantly clearer and louder on phone speakers.
            - **Smart Swipe Volume Boost Indicator:** Swiping up on the right side of the screen now smoothly continues beyond 100% up to 200% with a dedicated golden amber boost indicator and real-time percentage feedback.
            - **Enhanced Settings Toggle:** Added Volume Boost switch in Enhanced Settings (`Player` category) to easily enable or disable audio boost.
            - **Player & System Stability Fixes:** Fixed Live TV LazyColumn duplicate key playlist crash, Continue Watching progress sync, custom layout constraints, and extension popup scroll.
          draft: false
          prerelease: true
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

