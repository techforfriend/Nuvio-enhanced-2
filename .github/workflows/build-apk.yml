name: Build Nuvio Enhanced APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioEnhanced-APKs
          path: build-apks/*.apk
          retention-days: 14

      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.1-enhanced-pre5
          name: "Nuvio Enhanced v0.6.1-beta (Update 5 - Icons, Package com.nuvio.enhanced & UI Polish)"
          body: |
            ## Nuvio Enhanced v0.6.1-beta (Update 5)

            Major update bringing custom launcher icons from AKRusso, custom package name, refined App Experience, and complete removal of donation/diagnostics options.

            ### 🌟 What's New & Fixed in Update 5:
            1. **Added AKRusso Custom App Icons (12 Total):** Restored all alternate launcher icons from AKRusso Nuvio — Enhanced, Monochrome, Neon, Gear, Chrome, Aurora, Emerald, and more with live launcher activity switching.
            2. **Package Name Changed:** Set package name / Application ID to `com.nuvio.enhanced` cleanly separating Nuvio Enhanced from stock Nuvio.
            3. **App Display Name:** App name is now officially `Nuvio Enhanced` throughout the launcher and Android system.
            4. **Removed GitHub Footer Link:** Eliminated the Nuvio Enhanced GitHub community link and banner from Settings.
            5. **Fixed App Experience Settings:**
               - **Status Bar Visibility:** Real-time Android system status bar toggle (`show/hide`) now fully functional.
               - **App Icon Switcher:** Integrated App Icon selector directly inside App Experience settings with live icon preview thumbnail.
            6. **Removed Ko-fi Donation Box:** Completely removed the "Donate on Ko-fi" box from Nuvio Enhanced settings.
            7. **Diagnostics Cleaned Up:** Completely removed Diagnostics / Sentry crash reports from Advanced Settings and Search.

            ### 📥 Download APK
            Choose the build matching your Android device architecture below (most devices use `arm64-v8a` or `universal`).
          draft: false
          prerelease: true
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
