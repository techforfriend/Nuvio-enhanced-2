name: Build Nuvio Enhanced APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioEnhanced-APKs
          path: build-apks/*.apk
          retention-days: 14

      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.1-enhanced-pre2
          name: "Nuvio Enhanced v0.6.1-beta (Update 2)"
          body: |
            ## Nuvio Enhanced v0.6.1-beta (Update 2)

            Updated build of **Nuvio Enhanced v0.6.1-beta** featuring login fixes, premium theme unlock, and UI refinements.

            ### 🌟 Key Updates in this Build:
            - **Official Supabase Authentication / Login Fixed:** Configured public Supabase endpoints so email login, account sync, and profile restoration work seamlessly.
            - **All Premium Themes Unlocked:** Full access to all supporter themes (Gold, Jade, Rose Gold, Arctic Blue, Graphite) and custom gradient stops.
            - **Streamlined Settings UI:** Completely removed About section and Discord links across the app.
            - **Branding Update:** Updated footer below Advanced to proudly showcase "Nuvio Enhanced".
            - **Full Nuvio Enhanced Suite:** Includes Streaming Showcase Hero, HUD Status Bar, 200% Volume Boost, Tap-to-seek, Subtitle sync, Watch Party, and Media Server integration.

            ### 📥 Download APK
            Choose the build matching your Android device architecture below (most devices use `arm64-v8a` or `universal`).
          draft: false
          prerelease: true
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
