name: Build Nuvio Enhanced APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioEnhanced-APKs
          path: build-apks/*.apk
          retention-days: 14

      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.1-enhanced-pre7
          name: "Nuvio Enhanced v0.6.1-beta (Update 7 - Profile Backgrounds, Stream Pinning, Seek Previews & Shuffle)"
          body: |
            ## Nuvio Enhanced v0.6.1-beta (Update 7)

            Comprehensive update porting all remaining AKRusso features and completely fixing Profile Backgrounds!

            ### 🌟 What's New & Fixed in Update 7:
            1. **Profile Backgrounds 100% Unlocked & Working:**
               - Unlocked for all users without any subscription or paywall requirements.
               - Added 10 built-in theme presets: Gold, Jade, Rose Gold, Arctic Blue, Graphite, Messenger, Amethyst, Blossom, Lagoon, Sunset.
               - Added Custom Image URL field directly in Edit Profile.
               - Added live visual banner preview inside Edit Profile screen so you see your background immediately while editing!
               - Robust local offline caching and persistence ensures backgrounds never get wiped out.
            2. **Stream Source Pinning:**
               - Pin your favorite addons and scraper stream sources to always appear at the top.
               - Push pin toggles available in Plugins / Addons settings and on Streams list.
            3. **Timeline Seek Previews:**
               - Visual thumbnail preview card appears while scrubbing the player timeline.
               - Fully supported on both ExoPlayer and Libmpv engines.
            4. **Persistent Episode Shuffle:**
               - Added Shuffle toggle button in the player controls header for TV series.
               - Picks a random aired episode across seasons when enabled.
            5. **Themed Player Clock End-Time Overlay:**
               - Displays current device clock and calculated video end time with active theme accent styling.

            ### 📥 Download APK
            Optimized exclusively for 64-bit ARM Android devices (`arm64-v8a`).
          draft: false
          prerelease: true
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
