name: Build Nuvio Enhanced APK

on:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Set up Rust
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Restore release keystore from secrets
        env:
          NUVIO_RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          # NOTE: secrets cannot be referenced in a step `if:` expression
          # (GitHub rejects the workflow at parse time), so the
          # empty-secret check lives here in shell instead.
          if [ -n "$NUVIO_RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$NUVIO_RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/nuvio-enhanced.jks
          else
            echo "No release keystore secret set, skipping restore."
          fi

      - name: Build Android Release APK
        env:
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.1.0
          name: "Nuvio Enhanced v1.1.0"
          body: |
            ## What's New in v1.1.0
            **Nuvio Enhanced Official Release — version 1.1.0 (version code 159)**

            ### 🆕 New in this version
            - Smart Streams — auto-play picks the best source for your screen, untagged releases count as English, live connection status while choosing
            - Downloads — redesigned Downloads screen with a Downloaded section, download counts, pause/resume all and per-download speed; progress now shows a single percent sign
            - Servers — Plex and Silo join the media servers
            - Watched threshold — choose when a title counts as watched
            - Library — filter rows for genre, year and watched status
            - Home — pin rows top or bottom, hide rows, and a hidden-rows section; hero sources you choose
            - Player — skip, next episode and recommendation card moved above the end time; hero trailers stay off while the mini player or parked PiP plays
            - Collections — .gifv artwork plays as GIF and falls back to the static cover
            - Tracking addons — a consent dialog before a tracking addon gets your watch activity
            - Fixed — settings search and the download button no longer crash (missing default strings restored); CloudStream home now shows all catalogues instead of capping at 6
            - iOS — legacy download mode that writes straight to the folder; downloads settings stay in the tab that opened them
          draft: false
          prerelease: false
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

