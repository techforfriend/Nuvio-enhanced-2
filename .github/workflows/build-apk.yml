name: Build Nuvio Enhanced APK

on:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Set up Rust
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Restore release keystore from secrets
        env:
          NUVIO_RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          # NOTE: secrets cannot be referenced in a step `if:` expression
          # (GitHub rejects the workflow at parse time), so the
          # empty-secret check lives here in shell instead.
          if [ -n "$NUVIO_RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$NUVIO_RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/nuvio-enhanced.jks
          else
            echo "No release keystore secret set, skipping restore."
          fi

      - name: Build Android Release APK
        env:
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.9
          name: "Nuvio Enhanced v0.6.9"
          body: |
            ## What's New in v0.6.9
            **Nuvio Enhanced Official Release — version 0.6.9 (version code 152)**

            ### 🆕 New in this version
            - Ratings — star ratings for titles and episodes, a ratings source picker, and MDBList + SIMKL rating sync
            - Tamil language support
            - Cinematic backdrop — floating header over the backdrop, artwork fading into it, see-through chips and buttons, and smart framing for cropped backdrops
            - Discover header search action; library search box now behind a search action
            - Live TV header offset matched to the other tabs
            - Player — playback locks to landscape on tablets; edge swipes left to the system back gesture; keeps playing during calls with YouTube-like audio focus
            - Skip Intro — better Anime-Skip matching (Kitsu/MAL without an IntroDB mapping, no open-ended segments)
            - iOS — app background kept while the player is parked in PiP; collection folders draw under the native navigation bar so Glass UI shows through
            - Smoother scrolling on home, shelves and grids
            - Translation updates: Vietnamese, Bengali, French
          draft: false
          prerelease: false
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

