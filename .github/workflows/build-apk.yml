name: Build Nuvio Enhanced APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioEnhanced-APKs
          path: build-apks/*.apk
          retention-days: 14

      - name: Publish GitHub Stable Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.1-enhanced-stable
          name: "Nuvio Enhanced v0.6.1 Stable Release"
          body: |
            ## Nuvio Enhanced v0.6.1 Stable Release
            **by RAJA JI**

            🎉 **Official Stable Release of Nuvio Enhanced v0.6.1!**

            This stable release brings full CloudStream 3 provider integration, 18 customized themes, Jellyfin/Plex native streaming, and complete bug fixes across playback, metadata, and UI.

            ### 🌟 Key Features & Highlights:
            1. **Restored Live TV Navigation Dock & Streaming:**
               - Restored dedicated Live TV tab on the bottom navigation dock with standard TV icon.
               - Full Live TV guide, EPG sources, search & filter bar, and seamless channel player playback.
            2. **Enhanced Settings Fixed & Working:**
               - System Backup & Import file picker fully wired with native Android storage framework.
               - External Download Folder selector linked to DocumentFile SAF storage.
               - Dynamic DNS over HTTPS resolver with Google & Cloudflare DNS support and IPv4 fallback.
               - Home, Core, Player, and System settings organized and functional.
            3. **Redesigned AKRusso-Style Home Poster Hero:**
               - Frosted capsule header, IMDb rating badge, compact metadata, pill watch button, and subtle shelf underline.
            4. **Redesigned CloudStream Extension Switcher:**
               - Floating pill button at bottom-right with warm orange border and stacked layers icon.
               - Compact popup card floating above the pill with dark theme, orange highlights, and play badges.
            5. **Full CloudStream 3 Engine & Playback Availability:**
               - Run native CloudStream 3 `.cs3` plugins and extensions.
               - Direct link extraction, subtitle parsing, and zero playback unavailable blocks.
            6. **18 Customized Themes & "by RAJA JI" Branding:**
               - 18 themes and personalized "by RAJA JI" footer branding.
            7. **Pure ARM64 Architecture:**
               - Optimized exclusively for 64-bit ARM Android devices (`arm64-v8a`) for peak performance.
          draft: false
          prerelease: false
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

