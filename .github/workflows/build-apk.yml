name: Build Nuvio Enhanced APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioEnhanced-APKs
          path: build-apks/*.apk
          retention-days: 14

      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.1-enhanced-pre1
          name: "Nuvio Enhanced v0.6.1-beta (Pre-release)"
          body: |
            ## Nuvio Enhanced v0.6.1-beta (Pre-release)

            Official **Nuvio 0.6.1-beta** (`cmp-rewrite`) integrated with the complete **AKRusso Nuvio Enhanced** settings & UI suite.

            ### 🌟 Features Included:
            - **Enhanced Settings Suite:** All fork-exclusive customization options with JSON backup/restore.
            - **Streaming Showcase Hero:** Immersive full-screen backdrop headers with auto video trailer preview.
            - **Player Status HUD:** Real-time Clock, Battery %, and Network connectivity indicator pill.
            - **Enhanced Playback Controls:** 200% Volume Boost, Tap-to-seek, Subtitle sync sliders, and HLS Stream Quality Picker.
            - **Cinematic Detail Header:** Immersive gradient headers and richer network/production details.
            - **Profile Insights & Library Health:** Watch-time metrics, genre breakdowns, and broken metadata diagnostics.
            - **Official 0.6.1 Updates:** Includes Watch Party Mode and Media Server integrations.

            ### 📥 Download APK
            Choose the build matching your Android device architecture below (most devices use `arm64-v8a` or `universal`).
          draft: false
          prerelease: true
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
