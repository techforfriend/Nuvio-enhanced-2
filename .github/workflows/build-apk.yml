name: Build Nuvio Enhanced APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioEnhanced-APKs
          path: build-apks/*.apk
          retention-days: 14

      - name: Publish GitHub Stable Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.3-enhanced-stable
          name: "Nuvio Enhanced v0.6.3 Stable Release"
          body: |
            ## What's New in v0.6.3
            **by RAJA JI**

            ### 🌟 What's New:
            - **Player Live Stream Badges:** Real-time video/audio codec, resolution, and quality badges displayed directly in the player timeline/controls during active playback.
            - **Center Controls Stability on Pause:** Fixed center playback controls (play/pause, seek) hiding or glitching unexpectedly when paused; controls stay reliably visible and responsive on pause.
            - **Watch Party Chat Companion:** Live watch party companion improvements and plain text source handling.
            - **Binge Group Matching & Library Custom Posters:** Improved episode binge group matching algorithm and fixed custom library posters in catalog/collection views.
            - **Live TV Navigation Toggle:** Added on/off switch in Enhanced Settings (`App Experience` / `System`) to customize navigation bar visibility.
            - **Continue Watching & Stream Link Persistence:** Fixed profile login issue where Continue Watching progress and cached stream link memory could reset upon login.
            - **New Localizations:** Added Brazilian Portuguese (`pt-BR`), Hungarian (`hu`), and Vietnamese (`vi`) translations.
          draft: false
          prerelease: false
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

