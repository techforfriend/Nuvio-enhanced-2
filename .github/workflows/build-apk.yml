name: Build Nuvio Enhanced APK

on:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Set up Rust
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Publish GitHub Testing Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.4-beta.4
          name: "Nuvio Enhanced v0.6.4-beta.4"
          body: |
            ## What's New in v0.6.4-beta.4
            **by RAJA JI**

            ### 🚀 Vega Provider Overhaul & Stability:
            - **Robust JS Runtime:** Removed wrapping closures to directly bind exports, window, and self to `globalThis`.
            - **Complete Axios Polyfill:** Added query param serialization (`config.params`), `axios.create()`, and global bindings.
            - **Extended Cheerio Support:** Support for `.closest()`, `.is()`, `.hasClass()`, `.data()`, `.val()`, `.remove()`, and HTML fragment selector parsing.
            - **CommonJS Module Polyfills:** Added `url`, `querystring`, `qs`, and `path` module resolution.
            - **Resilient Invocation Fallbacks:** Automatic fallback between object arguments and positional arguments, plus stream array normalization.
            - **Script Fallback Resolution:** Fallback to non-`dist` paths if primary Vega provider bundle URL fails.

            ### 🏠 Home Screen Catalog Improvements:
            - **Distinct Extension Shelves:** Clear, recognizable titles (`Vega • <Provider> - <Section>` and `CS3 • <Plugin> - <Section>`).
            - **Strict Priority Ordering:** Stremio catalogs appear at the top, followed by Vega catalogs, followed by CS3 catalogs.
            - **Simultaneous Extension Selection:** Select both Vega and CS3 providers together or toggle them individually ("off" state supported).
            - **Concurrent Catalog Loading:** Vega and CS3 catalogs load in parallel, eliminating delays and timeouts.
          draft: false
          prerelease: true
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

