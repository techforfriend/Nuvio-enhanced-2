name: Build Nuvio Enhanced APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioEnhanced-APKs
          path: build-apks/*.apk
          retention-days: 14

      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.1-enhanced-pre4
          name: "Nuvio Enhanced v0.6.1-beta (Update 4 - Settings Fix & Permanent Signing)"
          body: |
            ## Nuvio Enhanced v0.6.1-beta (Update 4)

            Critical update addressing settings persistence across app restarts and permanent release signing for seamless future updates.

            ### 🌟 Key Fixes in Update 4:
            - **Settings Persistence Fixed:** Enhanced settings toggles (Player HUD, Next Episode button, Clock overlay, Hero controls, etc.) now properly persist across app restarts and profile switches using multi-layer SharedPreferences storage with immediate disk flush.
            - **Deterministic Release Keystore Added:** Embedded a dedicated release signing key in the build pipeline. All APKs from this release onwards share the exact same cryptographic signature.
            - **Seamless Future Updates:** Eliminates "App not installed as package conflicts with an existing package" errors for all subsequent releases. (Note: Since previous builds used ephemeral debug keys, uninstall any existing build once before installing Update 4; all future updates after this will install directly in 1-click!).
            - **All Enhanced Features Working:** Player status overlay (battery, network, clock, end-time), Next Episode persistent skip button, IMDb star ratings, and customizable hero showcase.

            ### 📥 Download APK
            Choose the build matching your Android device architecture below (most devices use `arm64-v8a` or `universal`).
          draft: false
          prerelease: true
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
