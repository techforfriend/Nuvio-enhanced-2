name: Build Nuvio Enhanced APK

on:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Set up Rust
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Publish GitHub Testing Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.4-beta.5
          name: "Nuvio Enhanced v0.6.4-beta.5"
          body: |
            ## What's New in v0.6.4-beta.5
            **by RAJA JI**

            ### 🚀 Vega Link Extraction & Playback Fixes:
            - **Series Episode Link Resolution:** Fixed series stream fetching so Vega episodes properly resolve direct download links from season/episode metadata rather than querying blog post URLs.
            - **VegaDrive & FastDL Direct Link Extraction:** Fixed Axios polyfill to support `maxRedirects: 0` without auto-following redirects, enabling `vegadriveExtractor` to capture 302 Location headers for Pixeldrain, Gofile, Buzzheavier, and Transfer.it.
            - **Header Normalization in QuickJS:** Exposed `_rawHeaders`, `Location`, and `Set-Cookie` in fetch response headers so scrapers can read cookies and redirect targets.
            - **Fallback Direct Link Resolution:** Added direct FastDL and G-Direct stream extraction when stream scraper returns empty.
            - **URL Sanitization:** Cleaned URL fragments (`#`) and trailing `:season:episode` suffixes from video IDs and links.

            ### 🏷️ Vega UI Enhancements:
            - **BETA Badge:** Added clean "BETA" badge to "VEGA PROVIDERS" inside the Extensions option box and in Vega Settings section.
            - **Pill Label Update:** Displays "(BETA)" next to active Vega provider names on the Home screen header pill.
          draft: false
          prerelease: true
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

