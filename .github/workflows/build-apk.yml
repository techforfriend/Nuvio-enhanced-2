name: Build Nuvio Enhanced APK

on:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Set up Rust
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Restore release keystore from secrets
        env:
          NUVIO_RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          # NOTE: secrets cannot be referenced in a step `if:` expression
          # (GitHub rejects the workflow at parse time), so the
          # empty-secret check lives here in shell instead.
          if [ -n "$NUVIO_RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$NUVIO_RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/nuvio-enhanced.jks
          else
            echo "No release keystore secret set, skipping restore."
          fi

      - name: Build Android Release APK
        env:
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.6.6
          name: "Nuvio Enhanced v0.6.6"
          body: |
            ## What's New in v0.6.6
            **Nuvio Enhanced Official Release — version 0.6.6 (version code 149)**

            ### 🆕 Official upstream 0.6.6 (Luqman)
            - Compose Multiplatform rewrite (cmp-rewrite) — the underlying app rewrite from upstream
            - Subtitle overhaul: new subtitle appearance system (fonts, shadow, background), subtitle size in 1sp steps, and subtitle customisation
            - Chapter skip intervals — skip intros, recaps and credits with merged skip regions
            - Skip Intro: timing setting and auto-skip on resolved streams
            - MPV night mode (audio compressor) with a night mode button on every engine
            - Offline playback fixes and translation (i18n) updates

            ### 🔧 Player settings — repaired in this build
            - Chapters toggle (Exo chapters), legacy player top/bottom button layouts, and night mode button + night mode settings are now wired to storage and applied — these were missing after the upstream sync and are fixed in this build
            - Subtitle appearance settings (font, shadow, size) moved to the new subtitle system
            - Auto-switch playback engine on error and libass render mode settings added
            - Playback settings reorganised into: Player, Stream selection, Up next, Skip, Interface, Audio, Subtitles, Video, Buffer, P2P

            ### 📺 TV version (same APK, "Nuvio Enhanced TV" icon)
            - Reshaped-style layout: floating pill menu and a Netflix-style billboard that follows the focused card
            - Chapters panel with chapter marks on the progress bar, and seek previews
            - Live TV screen, Downloads, Watch Party, Cast, PiP, and audio/subtitle track selection
            - Debrid resolve and torrent playback on TV, with TV text now in English
            - Note: the TV release post (v0.6.5-tv) is separate; this post is the phone release

            ### ⚡ Still included from before
            - CloudStream 3 pure engine, Trakt / SIMKL / MDBList tracking, 200% volume boost, full IPTV suite, Nuvio Read, and bottom-left player controls
            - Single arm64 APK for phones; installs in place over v0.6.5
          draft: false
          prerelease: false
          files: build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

